<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>StarTools - Modpack Manager</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #09090b;
      }
      .startup-splash {
        display: flex;
        width: 100%;
        height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        color: #e4e4e7;
        font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        -webkit-font-smoothing: antialiased;
      }
      .startup-splash-mark {
        display: grid;
        width: 50px;
        height: 50px;
        place-items: center;
        color: #67e8f9;
        border: 1px solid rgb(34 211 238 / 24%);
        border-radius: 15px;
        background: #111318;
        box-shadow: 0 0 32px rgb(34 211 238 / 10%);
        animation: startup-pulse 1.8s ease-in-out infinite;
      }
      @keyframes startup-pulse {
        0%,
        100% { opacity: 0.78; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-splash-mark { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="startup-splash" role="status" aria-label="StarTools is loading">
        <div class="startup-splash-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.5 14.2 9.8 20.5 12l-6.3 2.2L12 20.5l-2.2-6.3L3.5 12l6.3-2.2L12 3.5Z" />
            <path d="m18.5 3 .6 1.9L21 5.5l-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6.6-1.9Z" />
          </svg>
        </div>
        <span>StarTools</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
